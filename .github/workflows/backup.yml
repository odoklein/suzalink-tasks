name: Sauvegarde nocturne

# pg_dump -Fc de la base Supabase, chiffré avec age, envoyé dans un bucket
# S3 compatible situé dans l'UE. Ne fait rien tant que les secrets ne sont
# pas configurés (voir README « Sauvegardes »).
on:
  schedule:
    - cron: "15 1 * * *" # 1 h 15 UTC, soit 2 h 15 ou 3 h 15 à Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_AGE_RECIPIENT" ] || [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "Secrets de sauvegarde absents : rien à faire."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer age
        if: steps.config.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump, chiffrement, envoi
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          name="suzali-tasks-$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          # pg_dump 17 lit les serveurs plus anciens (Supabase 15/17).
          docker run --rm -e PGURL="$BACKUP_DATABASE_URL" postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$PGURL"' \
            | age --recipient "$BACKUP_AGE_RECIPIENT" > "$name"
          test -s "$name"
          endpoint_args=""
          if [ -n "${BACKUP_S3_ENDPOINT:-}" ]; then endpoint_args="--endpoint-url $BACKUP_S3_ENDPOINT"; fi
          aws s3 cp "$name" "s3://$BACKUP_S3_BUCKET/daily/$name" $endpoint_args --only-show-errors
          echo "Sauvegarde envoyée : $name ($(du -h "$name" | cut -f1))"
